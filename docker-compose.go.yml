name: ${CHATGPT2API_GO_PROJECT:-chatgpt2api-go}

services:
  app:
    image: ${CHATGPT2API_GO_IMAGE:-chatgpt2api-go:local}
    build:
      context: .
      dockerfile: Dockerfile.go
      target: app
      args:
        RELEASE_REPOSITORY: ${CHATGPT2API_RELEASE_REPOSITORY:-heiyuan0801/chat2api}
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_GO_BIND:-127.0.0.1}:${CHATGPT2API_GO_PORT:-3001}:8080"
    environment: &app-environment
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatgpt2api}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatgpt2api}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      CHATGPT2API_REDIS_NAMESPACE: ${CHATGPT2API_REDIS_NAMESPACE:-chatgpt2api-go}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?Set CHATGPT2API_AUTH_KEY}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  init:
    image: ${CHATGPT2API_GO_IMAGE:-chatgpt2api-go:local}
    profiles: [tools]
    environment: *app-environment
    entrypoint: [control-server]
    command: [-init-schema, -init-only]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatgpt2api}
      POSTGRES_USER: ${POSTGRES_USER:-chatgpt2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --requirepass "$$REDISCLI_AUTH" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru']
    tmpfs: [/data]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-data:
  postgres-data:
